<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nonogram">
<title>Nonogram</title>
<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#14171c;--muted:#7b8390;--line:#e4e6ea;--empty:#eef0f3;--empty2:#e2e5ea;--edge:#cdd2da;--accent:#3b5bdb;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#171a1f;--text:#eceef2;--muted:#808793;--line:#262a31;--empty:#20242b;--empty2:#292e36;--edge:#3a404a;--accent:#7d93f5;--on:#0e1013}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#171a1f;--text:#eceef2;--muted:#808793;--line:#262a31;--empty:#20242b;--empty2:#292e36;--edge:#3a404a;--accent:#7d93f5;--on:#0e1013}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:20px 16px 36px}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:6px 4px 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;background:var(--empty);border-radius:14px;margin:0 0 16px}
.seg.below{margin:18px 0 0}
.seg button{flex:1 1 0;min-height:40px;padding:0 10px;color:var(--text);background:transparent;border:0;border-radius:10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on);font-weight:600}
.bar{display:flex;align-items:flex-end;gap:26px;margin:0 2px 20px;font-variant-numeric:tabular-nums}
.bar .k{display:block;color:var(--muted);font-size:13px}
.bar #time{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.bar #best{font-size:20px;font-weight:600;line-height:1.5}
.bar button{margin-left:auto;min-height:40px;padding:0 14px;color:var(--text);background:var(--empty);border:0;border-radius:12px}
.bar button[aria-pressed="false"]{color:var(--muted)}
#wrap{display:grid;grid-template-columns:max-content max-content;justify-content:center;font-variant-numeric:tabular-nums}
#cols{display:flex}
#rows{display:flex;flex-direction:column}
.cc{width:var(--u);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:calc(var(--u)*.2 + 9px);font-size:max(9px,calc(var(--u)*.52));line-height:1.15;font-weight:500}
.rc{height:var(--u);display:flex;justify-content:flex-end;align-items:center;gap:calc(var(--u)*.3);padding-right:calc(var(--u)*.2 + 9px);font-size:max(9px,calc(var(--u)*.52));font-weight:500}
.cc.done,.rc.done{color:var(--muted);opacity:.5;font-weight:400}
#board{display:grid;touch-action:none;border-radius:10px;box-shadow:0 0 0 6px var(--card),0 0 0 7.5px var(--edge);transition:box-shadow .2s}
#board.solved{box-shadow:0 0 0 6px var(--card),0 0 0 8px var(--accent)}
.cell{position:relative;isolation:isolate;width:var(--u);height:var(--u);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:calc(var(--u)*.7);line-height:1}
.cell::before{content:"";position:absolute;inset:max(1px,calc(var(--u)*.07));border-radius:calc(var(--u)*.24);background:var(--empty);z-index:-1;transition:background .1s}
.cell.alt::before{background:var(--empty2)}
.cell.f::before{background:var(--accent)}
.msg{min-height:24px;margin:20px 0 0;text-align:center;font-weight:600;color:var(--accent)}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1 1 0;min-height:46px;padding:0 10px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:12px}
.act button:disabled{opacity:.4}
.act #new{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
.link{display:block;margin:10px auto 0;min-height:44px;padding:0 12px;color:var(--muted);background:transparent;border:0;text-decoration:underline}
</style>
</head>
<body>
<main>
<h1>Nonogram</h1>
<div class="card">
<div class="seg" id="size"></div>
<div class="bar"><div><span class="k">Time</span><span id="time">0:00</span></div><div><span class="k">Best</span><span id="best">&ndash;</span></div><button type="button" id="snd" aria-pressed="true">Sound on</button></div>
<div id="wrap"><div></div><div id="cols"></div><div id="rows"></div><div id="board"></div></div>
<p class="msg" id="msg" aria-live="polite"></p>
<div class="seg below" id="mode"></div>
<div class="act"><button type="button" id="undo">Undo</button><button type="button" id="clear">Clear</button><button type="button" id="new">New puzzle</button></div>
<button type="button" class="link" id="reset">Reset best times</button>
</div>
</main>
<script>
let S={n:10,sol:[],cells:[],mode:1,t:0,snd:true},B={},run=false,last=0,prevDone=0,lastSnd=0,ac,undo=[],solved=false,u=24,rowC=[],colC=[],rowEl=[],colEl=[],cellEl=[],stroke=null,paintV=0;
const $=id=>document.getElementById(id);
const board=$('board');

function runs(line){const r=[];let c=0;line.forEach(v=>{if(v===1)c++;else if(c){r.push(c);c=0}});if(c)r.push(c);return r.length?r:[0]}
const rowOf=(a,i)=>a.slice(i*S.n,(i+1)*S.n);
const colOf=(a,j)=>{const r=[];for(let i=0;i<S.n;i++)r.push(a[i*S.n+j]);return r};

function newGame(n){
 S.n=n;S.cells=new Array(n*n).fill(0);
 S.sol=S.cells.map(()=>Math.random()<.6?1:0);
 for(let i=0;i<n;i++){
  if(!rowOf(S.sol,i).includes(1))S.sol[i*n+Math.floor(Math.random()*n)]=1;
  if(!colOf(S.sol,i).includes(1))S.sol[Math.floor(Math.random()*n)*n+i]=1;
 }
 undo=[];S.t=0;run=false;build();
}
function save(){try{localStorage.setItem('nonogram',JSON.stringify(S))}catch(e){}}
function saveB(){try{localStorage.setItem('nonogram-best',JSON.stringify(B))}catch(e){}}

function build(){
 const n=S.n;
 rowC=[];colC=[];
 for(let i=0;i<n;i++){rowC.push(runs(rowOf(S.sol,i)));colC.push(runs(colOf(S.sol,i)))}
 const left=Math.max(...rowC.map(c=>c.length));
 const avail=Math.min($('wrap').parentElement.clientWidth-50,440);
 u=Math.max(12,Math.min(44,Math.floor(avail/(n+left+.6))));
 $('wrap').style.setProperty('--u',u+'px');
 const cols=$('cols'),rows=$('rows');
 cols.innerHTML='';rows.innerHTML='';board.innerHTML='';
 colEl=colC.map(c=>{const d=document.createElement('div');d.className='cc';d.innerHTML=c.map(v=>'<span>'+v+'</span>').join('');cols.appendChild(d);return d});
 rowEl=rowC.map(c=>{const d=document.createElement('div');d.className='rc';d.innerHTML=c.map(v=>'<span>'+v+'</span>').join('');rows.appendChild(d);return d});
 board.style.gridTemplateColumns='repeat('+n+',var(--u))';
 cellEl=[];
 for(let i=0;i<n*n;i++){
  const d=document.createElement('div'),r=Math.floor(i/n),c=i%n;
  d.className='cell'+((((r/5)|0)+((c/5)|0))%2?' alt':'');
  board.appendChild(d);cellEl.push(d);
 }
 S.cells.forEach((_,i)=>paint(i));
 sync();
}
function paint(i){
 const v=S.cells[i],d=cellEl[i];
 d.classList.toggle('f',v===1);
 d.textContent=v===2?'\u00d7':'';
}
function sync(quiet){
 let ok=true,cnt=0;
 for(let i=0;i<S.n;i++){
  const a=runs(rowOf(S.cells,i)).join()===rowC[i].join();
  const b=runs(colOf(S.cells,i)).join()===colC[i].join();
  rowEl[i].classList.toggle('done',a);colEl[i].classList.toggle('done',b);
  if(a)cnt++;if(b)cnt++;
  if(!a||!b)ok=false;
 }
 const was=solved;solved=ok;board.classList.toggle('solved',ok);
 if(ok&&!was&&!quiet)onSolve();
 else if(!quiet&&cnt>prevDone)chime();
 prevDone=cnt;
 if(!ok)$('msg').textContent='';
 else if(quiet)$('msg').textContent='Solved in '+fmt(S.t);
 showBest();showTime();
 $('undo').disabled=!undo.length;
 document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===S.mode)));
 document.querySelectorAll('#size button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===S.n)));
 $('snd').textContent=S.snd?'Sound on':'Sound off';$('snd').setAttribute('aria-pressed',String(S.snd));
 save();
}

const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function showTime(){$('time').textContent=fmt(S.t)}
function showBest(){$('best').textContent=(B[S.n]?fmt(B[S.n]):'\u2013')}
function start(){if(!run&&!solved){run=true;last=performance.now()}}
function tick(){if(run){const t=performance.now();S.t+=t-last;last=t;showTime()}}
function stop(){tick();run=false}
function tone(f,d,type,vol,at){
 if(!S.snd)return;
 try{
  ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime+(at||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02);
 }catch(e){}
}
const chime=()=>{tone(660,.14,'sine',.12);tone(880,.2,'sine',.12,.09)};
const win=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i===3?.6:.25,'sine',.14,i*.12));
function onSolve(){
 stop();
 let m='Solved in '+fmt(S.t);
 if(S.t>0&&(!B[S.n]||S.t<B[S.n])){B[S.n]=S.t;saveB();m+='. New best time!'}
 $('msg').textContent=m;showBest();win();
}
function cellAt(e){
 const r=board.getBoundingClientRect(),c=Math.floor((e.clientX-r.left)/u),w=Math.floor((e.clientY-r.top)/u);
 return(c<0||w<0||c>=S.n||w>=S.n)?-1:w*S.n+c;
}
function setCell(i,v){if(S.cells[i]===v)return;stroke.push([i,S.cells[i]]);S.cells[i]=v;paint(i);const t=performance.now();if(t-lastSnd>35){lastSnd=t;tone(v===1?520:v===2?300:380,.07,v===2?'square':'triangle',v===2?.05:.12)}}
board.addEventListener('pointerdown',e=>{
 if(solved)return;
 const i=cellAt(e);if(i<0)return;
 e.preventDefault();board.setPointerCapture(e.pointerId);
 start();stroke=[];paintV=S.cells[i]===S.mode?0:S.mode;setCell(i,paintV);
});
board.addEventListener('pointermove',e=>{
 if(!stroke)return;
 const i=cellAt(e);if(i>=0)setCell(i,paintV);
});
const end=()=>{if(!stroke)return;if(stroke.length)undo.push(stroke);stroke=null;sync()};
board.addEventListener('pointerup',end);
board.addEventListener('pointercancel',end);

$('undo').onclick=()=>{const s=undo.pop();if(!s)return;s.reverse().forEach(p=>{S.cells[p[0]]=p[1];paint(p[0])});sync()};
$('clear').onclick=()=>{const s=[];S.cells.forEach((v,i)=>{if(v){s.push([i,v]);S.cells[i]=0;paint(i)}});if(s.length)undo.push(s);sync()};
$('new').onclick=()=>newGame(S.n);
$('snd').onclick=()=>{S.snd=!S.snd;sync(true);tone(660,.08,'sine',.12)};
let rst;$('reset').onclick=function(){
 if(this.dataset.arm){B={};saveB();delete this.dataset.arm;this.textContent='Reset best times';clearTimeout(rst);showBest();return}
 this.dataset.arm=1;this.textContent='Tap again to reset';
 rst=setTimeout(()=>{delete this.dataset.arm;this.textContent='Reset best times'},3000);
};

[5,10,15].forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=n+'\u00d7'+n;b.dataset.v=n;b.onclick=()=>newGame(n);$('size').appendChild(b)});
[[1,'Fill'],[2,'Cross']].forEach(o=>{const b=document.createElement('button');b.type='button';b.textContent=o[1];b.dataset.v=o[0];b.onclick=()=>{S.mode=o[0];sync()};$('mode').appendChild(b)});

try{
 const ic=document.createElement('canvas');ic.width=ic.height=180;const q=ic.getContext('2d');
 q.fillStyle='#3b5bdb';q.fillRect(0,0,180,180);q.fillStyle='#fff';
 ['00100','01110','11111','01110','00100'].forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='1'){q.beginPath();if(q.roundRect)q.roundRect(32+x*23,32+y*23,21,21,6);else q.rect(32+x*23,32+y*23,21,21);q.fill()}}));
 const l=document.createElement('link');l.rel='apple-touch-icon';l.href=ic.toDataURL('image/png');document.head.appendChild(l);
}catch(e){}

try{
 try{B=JSON.parse(localStorage.getItem('nonogram-best')||'{}')}catch(e){}
 const d=JSON.parse(localStorage.getItem('nonogram')||'null');
 if(d&&[5,10,15].includes(d.n)&&d.sol.length===d.n*d.n&&d.cells.length===d.n*d.n){S=Object.assign({mode:1,t:0,snd:true},d);build()}else newGame(10);
}catch(e){newGame(10)}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();save()}});
window.addEventListener('pagehide',()=>{stop();save()});
let rt;window.addEventListener('resize',()=>{cancelAnimationFrame(rt);rt=requestAnimationFrame(build)});
</script>
</body>
</html>
